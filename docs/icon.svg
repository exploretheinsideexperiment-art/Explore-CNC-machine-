<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Grid lines / CNC coordinate bed -->
  <path d="M96 160 H416 M96 224 H416 M96 288 H416 M96 352 H416" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
  <path d="M160 96 V416 M224 96 V416 M288 96 V416 M352 96 V416" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Outer CNC Working Frame -->
  <rect x="96" y="96" width="320" height="320" rx="16" fill="none" stroke="#334155" stroke-width="6" />

  <!-- Plotter drawn vector path (spiral/star/letter) -->
  <path d="M140 330 Q 180 200 256 220 T 360 160 T 340 320 T 220 340" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- X-Axis Gantry Bar -->
  <rect x="80" y="212" width="352" height="16" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3" />

  <!-- Y-Axis Carriage / Pen Head -->
  <rect x="236" y="196" width="40" height="48" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="4" />

  <!-- Pen Body -->
  <rect x="250" y="160" width="12" height="70" rx="4" fill="url(#amberGrad)" />
  <!-- Pen Tip -->
  <polygon points="250,230 262,230 256,252" fill="#e2e8f0" />
  <circle cx="256" cy="252" r="5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Limit switch / origin marker -->
  <circle cx="96" cy="96" r="8" fill="#ef4444" />
  <text x="115" y="103" fill="#94a3b8" font-family="monospace" font-size="14" font-weight="bold">(0,0)</text>
</svg>
